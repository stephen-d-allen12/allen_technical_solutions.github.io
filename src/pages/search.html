title: Search
heading: Search
lead: Find services, projects, products and help articles.
description: Search the Allen Technical Solutions website.
search: no
sitemap: no
---
<section class="section">
  <div class="wrap">
    <form class="big-search" action="search.html" method="get" role="search">
      <label class="sr-only" for="q-big">Search</label>
      <input id="q-big" name="q" type="search" placeholder="Search">
      <button class="btn btn-primary" type="submit">{{icon:search}} Search</button>
    </form>
    <h2 data-search-title style="font-size:1.4rem">Search the site</h2>
    <ul class="results" data-search-results></ul>
  </div>
</section>
